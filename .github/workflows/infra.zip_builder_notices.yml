# Regenerates the NOTICES file the zip builder's zip ships (CoreOnly/licenses/NOTICES) from the
# package graph with `zip-builder notices`, and opens a pull request when it changes, so license
# changes get reviewed. The legacy CocoaPods zip's CoreOnly/NOTICES is still generated by
# infra.notice_generation.yml.
name: infra.zip_builder_notices

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - '.github/workflows/infra.zip_builder_notices.yml'
  workflow_dispatch:
  schedule:
    # Every day at 10:00 UTC, like infra.notice_generation.yml.
    - cron: '0 10 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  MIN_XCODE: Xcode_26.2
  # main's Package.swift can require dependency tags that aren't published yet (see Package.swift).
  FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
  NOTICES_PATH: CoreOnly/licenses/NOTICES

jobs:
  notices:
    # Don't run on private repos.
    if: github.repository == 'firebase/firebase-ios-sdk' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The pull request step pushes a branch with the GITHUB_TOKEN.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Xcode
        run: sudo xcode-select -s /Applications/${{ env.MIN_XCODE }}.app/Contents/Developer

      # Reuses infra.zip_diff's SwiftPM cache (zip builder and package checkouts), read-only.
      - uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            scripts/zip_builder/.build
            .build
          key: ${{ runner.os }}-${{ env.MIN_XCODE }}-zip-diff-spm-${{ hashFiles('scripts/zip_builder/Package.swift', 'scripts/zip_builder/Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.MIN_XCODE }}-zip-diff-spm-

      - name: Generate NOTICES
        run: |
          swift run --package-path scripts/zip_builder -c release --force-resolved-versions \
            zip-builder notices --package-path . --output "$NOTICES_PATH" \
            --version "$(sed -nE 's/^let firebaseVersion = "([^"]+)".*/\1/p' Package.swift)"
          git diff --stat -- "$NOTICES_PATH"

      - name: Create a pull request
        if: github.event_name != 'pull_request'
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gem install octokit
          ruby scripts/create_pull_request.rb \
            --repo-root "${GITHUB_WORKSPACE}" \
            --repo-token "${{ secrets.GITHUB_TOKEN }}" \
            --target-path "${GITHUB_WORKSPACE}/${NOTICES_PATH}" \
            --pr-title "NOTICES Change (zip builder)" \
            --pr-body "A change to the zip builder's NOTICES is detected in [this GitHub Actions Run](${RUN_URL})." \
            --commit-comment "Update the zip builder's NOTICES."
