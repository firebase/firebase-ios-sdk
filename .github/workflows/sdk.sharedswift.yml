name: sdk.sharedswift

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'FirebaseSharedSwift**'
    - '.github/workflows/sdk.sharedswift.yml'
    - '.github/workflows/_spm.yml'

  schedule:
    # Run every day at 4am (PDT) / 7am (EDT) - cron uses UTC times
    - cron:  '0 11 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
  spm:
    uses: ./.github/workflows/_spm.yml
    with:
      target: FirebaseSharedSwiftTests

