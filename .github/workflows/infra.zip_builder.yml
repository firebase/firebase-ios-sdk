name: infra.zip_builder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/zip_builder/**'
      - 'scripts/zip_builder.sh'
      - 'zip_builder.jsonc'
      - 'zip_builder.json'
      - '.github/workflows/infra.zip_builder.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/zip_builder/**'
      - 'scripts/zip_builder.sh'
      - 'zip_builder.jsonc'
      - 'zip_builder.json'
      - '.github/workflows/infra.zip_builder.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_CI: true
  MIN_XCODE: Xcode_26.2

jobs:
  unit_tests:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ env.MIN_XCODE }}.app/Contents/Developer

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: scripts/zip_builder/.build
          key: ${{ runner.os }}-${{ env.MIN_XCODE }}-zip-builder-tests-${{ hashFiles('scripts/zip_builder/Package.swift', 'scripts/zip_builder/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.MIN_XCODE }}-zip-builder-tests-

      # ZIP_BUILDER_E2E also builds the fixture package for iOS with xcodebuild (about 10 s).
      - name: Run zip-builder tests
        env:
          ZIP_BUILDER_E2E: 1
        run: swift test --package-path scripts/zip_builder --force-resolved-versions
