name: sdk.installations

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'FirebaseInstallations**'
    - 'scripts/spm_test_schemes/InstallationsUnit.xcscheme'
    - 'scripts/secrets/Installations.json'
    - 'scripts/build.sh'
    - 'Package.swift'
    - '.github/workflows/sdk.installations.yml'
    - '.github/workflows/_spm.yml'
    - '.github/workflows/_cocoapods.yml'
    - '.github/workflows/_catalyst.yml'
    - '.github/workflows/_quickstart.yml'
    - '.github/workflows/_cocoapods.cron.yml'
    - 'Gemfile*'
    - '!**/CHANGELOG.md'
  schedule:
    # Run every day at 11pm (PDT) / 2am (EDT) - cron uses UTC times
    - cron:  '0 6 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
  spm:
    uses: ./.github/workflows/_spm.yml
    with:
      target: InstallationsUnit

  catalyst:
    uses: ./.github/workflows/_catalyst.yml
    with:
      product: FirebaseInstallations
      target: FirebaseInstallations-Unit-unit

  pod_lib_lint:
    uses: ./.github/workflows/_cocoapods.yml
    with:
      product: FirebaseInstallations
      setup_command: scripts/configure_test_keychain.sh

  testapp-integration:
    # The tests need the encrypted GoogleService-Info.plist, which isn't available to forks.
    if: (github.repository == 'firebase/firebase-ios-sdk' && github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    runs-on: macos-26
    env:
      secrets_passphrase: ${{ secrets.GHASecretsGPGPassphrase1 }}
      # Fail the tests that need a Firebase project if the plist is missing.
      FIS_INTEGRATION_TESTS_REQUIRED: 1
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Run integration tests
      run: scripts/repo.sh test --secrets ./scripts/secrets/Installations.json --platforms ${{ matrix.platform }} --xcode Xcode_26.2 Installations
    - name: Upload xcodebuild logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: xcodebuild-testapp-integration-${{ matrix.platform }}.log
        path: xcodebuild-*.log
        retention-days: 2

  quickstart:
    uses: ./.github/workflows/_quickstart.yml
    with:
      product: Installations
      setup_command: scripts/setup_quickstart.sh installations
      plist_src_path: scripts/gha-encrypted/Installations/GoogleService-Info.plist.gpg
      plist_dst_path: quickstart-ios/installations/GoogleService-Info.plist
    secrets:
      plist_secret: ${{ secrets.GHASecretsGPGPassphrase1 }}

  installations-cron-only:
    needs: pod_lib_lint
    uses: ./.github/workflows/_cocoapods.cron.yml
    with:
      product: FirebaseInstallations
      platforms: '[ "ios", "tvos", "macos" ]'
      flags: '[ "--use-static-frameworks" ]'
      # For toolchains var, see https://github.com/actions/runner-images/issues/13135#issuecomment-3397914993
      setup_command: |
        echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV
        scripts/configure_test_keychain.sh
