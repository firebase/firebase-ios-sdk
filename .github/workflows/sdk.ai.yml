name: sdk.ai

on:
  pull_request:
    paths:
    - 'FirebaseAI**'
    - 'GeminiLanguageModel**'
    - '.github/workflows/sdk.ai.yml'
    - '.github/workflows/_spm.yml'
    - '.github/workflows/_cocoapods.yml'
    - 'scripts/build.sh'
    - 'scripts/quickstart_build_spm.sh'
    - 'scripts/update_firebase_spm_dependency.sh'
    - 'Gemfile*'
    # Do not run for documentation-only PRs.
    - '!**.md'
  schedule:
    # Run every day at 12am (PDT) / 3am (EDT) - cron uses UTC times
    - cron:  '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Needed for actions/checkout

jobs:
  spm:
    strategy:
      matrix:
        target: [FirebaseAILogicUnit]
    uses: ./.github/workflows/_spm.yml
    with:
      target: ${{  matrix.target }}
      setup_command: scripts/update_vertexai_responses.sh
      env_vars: '{"FIREBASE_APP_CHECK_BRANCH": "main"}'

  testapp-integration:
    name: testapp-integration (${{ matrix.name }})
    if: (github.repository == 'Firebase/firebase-ios-sdk' && github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Xcode version supported by Firebase. Builds for testing on PRs and
          # runs the standard integration tests in nightly runs.
          - name: ${{ github.event_name == 'schedule' && 'xcode-26-test' || 'xcode-26-build' }}
            os: macos-15
            target: iOS
            xcode: Xcode_26.2
            command: ${{ github.event_name == 'schedule' && 'test' || 'build-for-testing' }}
            # `build-for-testing` does not support `--exclude`.
            test_filter_arg: ${{ github.event_name == 'schedule' && '--exclude IntegrationTests-SPM/LiveSessionTests --exclude IntegrationTests-SPM/GeminiLanguageModelTests' || '' }}
            log_prefix: ${{ github.event_name == 'schedule' && 'xcodebuild' || 'xcodebuild-build-for-testing' }}
          - name: standard
            os: xcode-27
            target: iOS
            xcode: Xcode_27.0
            command: test
            test_filter_arg: --exclude IntegrationTests-SPM/LiveSessionTests --exclude IntegrationTests-SPM/GeminiLanguageModelTests
            log_prefix: xcodebuild
    runs-on: ${{ matrix.os }}
    needs: spm
    env:
      TEST_RUNNER_FIRAAppCheckDebugToken: ${{ secrets.VERTEXAI_INTEGRATION_FAC_DEBUG_TOKEN }}
      FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
      secrets_passphrase: ${{ secrets.GHASecretsGPGPassphrase1 }}
      FIREBASE_APP_CHECK_BRANCH: main
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Run integration tests
      env:
        COMMAND: ${{ matrix.command }}
        TARGET: ${{ matrix.target }}
        XCODE: ${{ matrix.xcode }}
        TEST_FILTER_ARG: ${{ matrix.test_filter_arg }}
      run: scripts/repo.sh "$COMMAND" --secrets ./scripts/secrets/AI.json --platforms "$TARGET" --xcode "$XCODE" $TEST_FILTER_ARG AI
    - name: Upload xcodebuild logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ matrix.log_prefix }}-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.xcode }}.log
        path: xcodebuild-*.log
        retention-days: 2

  testapp-integration-live:
    if: (github.repository == 'Firebase/firebase-ios-sdk' && github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    runs-on: xcode-27
    needs: spm
    env:
      TEST_RUNNER_FIRAAppCheckDebugToken: ${{ secrets.VERTEXAI_INTEGRATION_FAC_DEBUG_TOKEN }}
      FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
      secrets_passphrase: ${{ secrets.GHASecretsGPGPassphrase1 }}
      FIREBASE_APP_CHECK_BRANCH: main
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Run live integration tests
      run: scripts/repo.sh test --secrets ./scripts/secrets/AI.json --platforms iOS --xcode Xcode_27.0 --filter IntegrationTests-SPM/LiveSessionTests AI
    - name: Upload xcodebuild logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: xcodebuild-live-iOS-xcode-27-Xcode_27.0.log
        path: xcodebuild-*.log
        retention-days: 2

  testapp-integration-gemini-language-model:
    if: (github.repository == 'Firebase/firebase-ios-sdk' && github.event_name == 'schedule') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    runs-on: xcode-27
    needs: spm
    env:
      GEMINI_LANGUAGE_MODEL: 1
      TEST_RUNNER_FIRAAppCheckDebugToken: ${{ secrets.VERTEXAI_INTEGRATION_FAC_DEBUG_TOKEN }}
      FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
      secrets_passphrase: ${{ secrets.GHASecretsGPGPassphrase1 }}
      FIREBASE_APP_CHECK_BRANCH: main
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Run Gemini Language Model integration tests
      run: scripts/repo.sh test --secrets ./scripts/secrets/AI.json --platforms iOS --xcode Xcode_27.0 --filter IntegrationTests-SPM/GeminiLanguageModelTests AI
    - name: Upload xcodebuild logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: xcodebuild-gemini-language-model-iOS-xcode-27-Xcode_27.0.log
        path: xcodebuild-*.log
        retention-days: 2

  pod_lib_lint:
    strategy:
      matrix:
        product: [FirebaseAILogic]
    uses: ./.github/workflows/_cocoapods.yml
    with:
      product: ${{  matrix.product }}
      supports_swift6: true
      setup_command: scripts/update_vertexai_responses.sh

  quickstart:
    if: (github.repository == 'Firebase/firebase-ios-sdk' && github.event_name == 'schedule') || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - os: macos-15
            xcode: Xcode_26.2
          # TODO: Bump to 26.4 when "Unable to find a destination matching the provided destination specifier" is resolved.
          - os: macos-26
            xcode: Xcode_26.2
    runs-on: ${{ matrix.os }}
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name || 'main' }}
      FIREBASE_APP_CHECK_BRANCH: main
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Xcode
      run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app/Contents/Developer
    - name: Setup simulator
      uses: ./.github/actions/setup_simulator
      with:
        platform: iOS
    - name: Build Quickstart
      run: scripts/quickstart_build_spm.sh FirebaseAI
