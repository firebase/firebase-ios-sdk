name: sdk.appcheck

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'FirebaseAppCheck**'
    - '.github/workflows/sdk.appcheck.yml'
    - '.github/workflows/_spm.yml'
    - '.github/workflows/_cocoapods.yml'
    - '.github/workflows/_catalyst.yml'
    - '.github/workflows/_cocoapods.cron.yml'
    - 'Gemfile*'
  schedule:
    # Run every day at 12am (PDT) / 3am (EDT) - cron uses UTC times
    - cron:  '0 7 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
  spm:
    strategy:
      matrix:
        target: [FirebaseAppCheckUnit, FirebaseAppCheckUnitSwift]
    uses: ./.github/workflows/_spm.yml
    with:
      target: ${{  matrix.target }}

  catalyst:
    uses: ./.github/workflows/_catalyst.yml
    with:
      product: FirebaseAppCheck
      target: FirebaseAppCheck-Unit-unit

  pod_lib_lint:
    strategy:
      matrix:
        product: [FirebaseAppCheckInterop, FirebaseAppCheck]
    uses: ./.github/workflows/_cocoapods.yml
    with:
      product: ${{ matrix.product }}
      buildonly_platforms: macOS

  diagnostics:
    strategy:
      matrix:
        diagnostic: [tsan, asan, ubsan]
    uses: ./.github/workflows/_build.yml
    with:
      product: FirebaseAppCheckUnit
      platform: iOS
      method: spm
      sanitizers: ${{ matrix.diagnostic }}
      setup_command: scripts/setup_spm_tests.sh

  # Build-only. The E2E suites need live credentials, and App Attest and
  # DeviceCheck need a signed physical device; CI has neither. This catches
  # compile breaks in the test app and its tests. See
  # FirebaseAppCheck/Apps/FIRAppCheckTestApp/E2E_TESTING.md to run them.
  test_app_build:
    if: |
      (github.repository == 'firebase/firebase-ios-sdk' && github.event_name == 'schedule') ||
      contains(fromJSON('["pull_request", "workflow_dispatch"]'), github.event_name)
    runs-on: macos-26
    env:
      FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
    - name: Install placeholder GoogleService-Info.plist
      # The real plist is gitignored but the app target lists it as a
      # resource, so the build needs a file at that path. Nothing runs, so the
      # placeholder values from FirebaseCore's unit tests are enough.
      run: |
        cp FirebaseCore/Tests/Unit/Resources/GoogleService-Info.plist \
          FirebaseAppCheck/Apps/FIRAppCheckTestApp/FIRAppCheckTestApp/GoogleService-Info.plist
    - name: Build app and tests
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 60
        max_attempts: 3
        retry_wait_seconds: 120
        command: |
          export TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault
          xcodebuild build-for-testing \
            -project FirebaseAppCheck/Apps/FIRAppCheckTestApp/FIRAppCheckTestApp.xcodeproj \
            -scheme FIRAppCheckTestApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  app_check-cron-only:
    needs: pod_lib_lint
    uses: ./.github/workflows/_cocoapods.cron.yml
    with:
      product: FirebaseAppCheck
      platforms: '[ "ios" ]'
      flags: '[ "--skip-tests --use-modular-headers" ]'
