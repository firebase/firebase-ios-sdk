name: sdk.appcheck

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'FirebaseAppCheck**'
    - '.github/workflows/sdk.appcheck.yml'
    - '.github/workflows/_spm.yml'
    - '.github/workflows/_cocoapods.yml'
    - '.github/workflows/_catalyst.yml'
    - '.github/workflows/_cocoapods.cron.yml'
    - 'Gemfile*'
    - '!**/CHANGELOG.md'
  schedule:
    # Run every day at 12am (PDT) / 3am (EDT) - cron uses UTC times
    - cron:  '0 7 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
  spm:
    strategy:
      matrix:
        target: [FirebaseAppCheckUnit, FirebaseAppCheckUnitSwift]
    uses: ./.github/workflows/_spm.yml
    with:
      target: ${{  matrix.target }}

  api_compatibility:
    # Checks the public Swift and Objective-C APIs against the snapshots in
    # FirebaseAppCheck/Tests/API, which were generated from the Objective-C
    # implementation of the SDK, and runs the negative compile tests.
    runs-on: macos-26
    env:
      FIREBASECI_USE_LATEST_GOOGLEAPPMEASUREMENT: 1
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
    - name: Build
      run: swift build --target FirebaseAppCheckSwift
    - name: Build for the iOS Simulator
      run: |
        swift build --target FirebaseAppCheckSwift --scratch-path .build-ios \
          --triple arm64-apple-ios15.0-simulator \
          --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
    - name: Check the API snapshots
      run: |
        python3 FirebaseAppCheck/Tests/API/api_snapshot.py --check --platform macos
        python3 FirebaseAppCheck/Tests/API/api_snapshot.py --check --platform ios \
          --build-dir .build-ios
    - name: Negative compile tests
      run: |
        python3 FirebaseAppCheck/Tests/API/api_snapshot.py --negative --platform macos
        python3 FirebaseAppCheck/Tests/API/api_snapshot.py --negative --platform ios \
          --build-dir .build-ios

  catalyst:
    uses: ./.github/workflows/_catalyst.yml
    with:
      product: FirebaseAppCheck
      target: FirebaseAppCheck-Unit-unit

  pod_lib_lint:
    strategy:
      matrix:
        product: [FirebaseAppCheckInterop, FirebaseAppCheck]
    uses: ./.github/workflows/_cocoapods.yml
    with:
      product: ${{ matrix.product }}
      buildonly_platforms: macOS

  diagnostics:
    strategy:
      matrix:
        diagnostic: [tsan, asan, ubsan]
    uses: ./.github/workflows/_build.yml
    with:
      product: FirebaseAppCheckUnit
      platform: iOS
      method: spm
      sanitizers: ${{ matrix.diagnostic }}
      setup_command: scripts/setup_spm_tests.sh

  app_check-cron-only:
    needs: pod_lib_lint
    uses: ./.github/workflows/_cocoapods.cron.yml
    with:
      product: FirebaseAppCheck
      platforms: '[ "ios" ]'
      flags: '[ "--skip-tests --use-modular-headers" ]'
