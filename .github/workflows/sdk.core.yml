name: sdk.core

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'FirebaseCore**'
    - '.github/workflows/sdk.core.yml'
    - '.github/workflows/_spm.yml'
    - '.github/workflows/_cocoapods.yml'
    - '.github/workflows/_catalyst.yml'
    - '.github/workflows/_cocoapods.cron.yml'
    - 'scripts/**' # Smoke test changes in `scripts/`.
    - 'Gemfile*'
    - '!**/CHANGELOG.md'
  schedule:
    # Run every day at 3am (PDT) / 6am (EDT) - cron uses UTC times
    - cron:  '0 10 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
  spm:
    uses: ./.github/workflows/_spm.yml
    with:
      target: CoreUnit

  # Swift unit tests that don't use OCMock. See FirebaseCore/Tests/SwiftSuite.
  spm-swift-unit:
    uses: ./.github/workflows/_spm.yml
    with:
      target: CoreSwiftUnit

  # Compile-time and runtime checks that FirebaseCore's public API and Objective-C runtime
  # contract don't change. See FirebaseCore/Tests/APIBaselines/README.md.
  spm-api:
    strategy:
      matrix:
        target: [CoreSwiftAPI, CoreObjCAPI, CoreRuntimeABI]
    uses: ./.github/workflows/_spm.yml
    with:
      target: ${{ matrix.target }}
      platforms: '["iOS", "macOS"]'

  api-baselines:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Xcode
      # Must match the toolchain in FirebaseCore/Tests/APIBaselines/metadata.json.
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
    - name: Dump the current API
      run: scripts/core_api/core_api.py dump --out core_api_current
    - name: Compare with the baselines
      run: scripts/core_api/core_api.py check --current core_api_current
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: ${{ always() }}
      with:
        name: core-api-current
        path: core_api_current

  # Runs the Swift unit tests with ThreadSanitizer, then checks how much of FirebaseCore they
  # cover against FirebaseCore/Tests/APIBaselines/coverage.json. macOS only. See
  # FirebaseCore/Tests/APIBaselines/README.md.
  swift-unit-tsan-coverage:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
    - name: Xcode
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
    - name: Run the Swift unit tests with ThreadSanitizer
      run: scripts/core_api/run_tsan.sh --cloned-source-packages-path .build/core-packages
    - name: Check line coverage
      run: |
        scripts/core_api/coverage.py check --out core_coverage_current.json \
          --cloned-source-packages-path .build/core-packages
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: ${{ always() }}
      with:
        name: core-coverage-current
        path: core_coverage_current.json

  catalyst:
    uses: ./.github/workflows/_catalyst.yml
    with:
      product: FirebaseCore
      target: FirebaseCore-Unit-unit

  pod_lib_lint:
    uses: ./.github/workflows/_cocoapods.yml
    with:
      product: FirebaseCore

  core-cron-only:
    needs: pod_lib_lint
    uses: ./.github/workflows/_cocoapods.cron.yml
    with:
      product: FirebaseCore
      platforms: '[ "ios", "tvos", "macos" ]'
      flags: '[ "--use-static-frameworks" ]'
      runs_on: macos-26
      xcode: Xcode_26.4
      # For toolchains var, see https://github.com/actions/runner-images/issues/13135#issuecomment-3397914993
      setup_command: |
        echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV
