name: sdk.geminilanguagemodel

on:
  pull_request:
    paths:
    - 'GeminiLanguageModel**'
    - '.github/workflows/sdk.geminilanguagemodel.yml'
    # Do not run for documentation-only PRs.
    - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # Needed for actions/checkout

jobs:
  integration-test-server:
    name: integration-test-server (record)
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    env:
      AppCheckDebugToken: ${{ secrets.VERTEXAI_INTEGRATION_FAC_DEBUG_TOKEN }}
      TEST_RUNNER_AppCheckDebugToken: ${{ secrets.VERTEXAI_INTEGRATION_FAC_DEBUG_TOKEN }}
      secrets_passphrase: ${{ secrets.GHASecretsGPGPassphrase1 }}
      FIREBASE_PLIST_PATH: /private/tmp/GoogleService-Info.plist
      TEST_RUNNER_FIREBASE_PLIST_PATH: /private/tmp/GoogleService-Info.plist
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

    - name: Install dependencies
      run: brew install xcsift

    - name: Setup simulator
      uses: ./.github/actions/setup_simulator
      with:
        platform: iOS

    - name: Install google/test-server
      run: |
        TEST_SERVER_VERSION="v0.2.9"
        curl -sSL "https://github.com/google/test-server/releases/download/${TEST_SERVER_VERSION}/test-server_Darwin_arm64.tar.gz" -o /tmp/test-server.tar.gz
        sudo tar -xzf /tmp/test-server.tar.gz -C /usr/local/bin test-server
        rm /tmp/test-server.tar.gz
        test-server --help > /dev/null

    - name: Decrypt GoogleService-Info.plist
      run: |
        scripts/decrypt_gha_secret.sh \
          scripts/gha-encrypted/FirebaseAI/TestApp-GoogleService-Info.plist.gpg \
          "$FIREBASE_PLIST_PATH" \
          "$secrets_passphrase"
        chmod 600 "$FIREBASE_PLIST_PATH"

    - name: Start test-server (record mode)
      run: |
        GeminiLanguageModel/scripts/test_server/run_test_server.py record &
        for i in {1..30}; do
          if nc -z localhost 1443 && nc -z localhost 1444; then
            echo "test-server is listening on ports 1443 and 1444."
            break
          fi
          sleep 0.5
        done

    - name: Run GeminiLanguageModel integration tests
      working-directory: GeminiLanguageModel
      run: |
        xcodebuild test \
          -scheme gemini-for-foundation-models \
          -destination 'platform=iOS Simulator,name=Firebase-iPhone-15-Pro' \
          -only-testing:GeminiLanguageModelTests \
          2>&1 | tee /tmp/xcodebuild.log | xcsift -w -f github-actions

    - name: Stop test-server
      if: always()
      run: |
        pkill -f test-server || true
        rm -f "$FIREBASE_PLIST_PATH"

    - name: Upload test-server recordings
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: test-server-recordings-${{ github.run_id }}
        path: GeminiLanguageModel/scripts/test_server/recordings
        retention-days: 2

    - name: Upload test logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: xcodebuild-logs-${{ github.run_id }}
        path: /tmp/xcodebuild.log
        retention-days: 2
