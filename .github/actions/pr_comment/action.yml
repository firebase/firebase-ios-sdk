name: 'Pull request comment'
description: >-
  Keeps one pull request comment up to date: edits the comment with the given marker, or posts
  one when there's none. Failing to comment is a warning, not an error.
inputs:
  marker:
    description: >-
      Identifies the comment, as a hidden `<!-- marker -->` line. Keep it unique per report, so
      workflows don't edit each other's comments.
    required: true
  body:
    description: 'The comment, in Markdown. Give this or body-file.'
    required: false
    default: ''
  body-file:
    description: 'A file holding the comment, in Markdown. Give this or body.'
    required: false
    default: ''
  create:
    description: "'false' only edits an existing comment and never posts a new one."
    required: false
    default: 'true'
  pr-number:
    description: 'The pull request. Empty (e.g. on push) skips commenting.'
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: 'The repository, as owner/name.'
    required: false
    default: ${{ github.repository }}
  token:
    description: 'A token that can write pull request comments (permission pull-requests: write).'
    required: false
    default: ${{ github.token }}
outputs:
  result:
    description: "'created', 'updated', 'skipped' or 'failed'."
    value: ${{ steps.comment.outputs.result }}
  comment-id:
    description: 'The ID of the comment; empty when skipped or failed.'
    value: ${{ steps.comment.outputs.comment-id }}
runs:
  using: 'composite'
  steps:
    - id: comment
      shell: bash
      # Inputs go through the environment, not into the script, so their contents can't run as
      # shell commands.
      env:
        GH_TOKEN: ${{ inputs.token }}
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
        BODY_FILE: ${{ inputs.body-file }}
        CREATE: ${{ inputs.create }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        args=(--repository "$REPOSITORY" --pr-number "$PR_NUMBER" --marker "$MARKER")
        if [[ -n "$BODY_FILE" ]]; then
          args+=(--body-file "$BODY_FILE")
        else
          args+=(--body "$BODY")
        fi
        if [[ "$CREATE" == "false" ]]; then
          args+=(--update-only)
        fi
        python3 "$GITHUB_ACTION_PATH/pr_comment.py" "${args[@]}"
