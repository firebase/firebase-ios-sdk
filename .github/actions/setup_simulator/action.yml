name: Setup Simulator
description: Creates a simulator for the specified platform using the newest available runtime that supports its device type.
inputs:
  platform:
    description: 'Platform (iOS, iPad, tvOS, watchOS, visionOS, all)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup Simulator
      shell: bash
      run: scripts/setup_simulator.sh "${{ inputs.platform }}"
