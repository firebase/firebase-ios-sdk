name: Setup Simulator
description: Creates a simulator for the specified platform using the active Xcode runtime.
inputs:
  platform:
    description: 'Platform (iOS, tvOS, watchOS, visionOS, all)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup Simulator
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../../scripts/setup_simulator.sh" "$PLATFORM"
