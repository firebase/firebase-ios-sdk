endpoints:
  # Gemini Developer API
  - target_host: generativelanguage.googleapis.com
    target_type: https
    target_port: 443
    source_type: http
    source_port: 1443
    redact_request_headers:
      - X-Goog-Api-Key
      - Authorization
      - Accept-Language
      - User-Agent
      - X-Goog-Api-Client
      - X-Ios-Bundle-Identifier
      - x-ios-bundle-identifier

  # Firebase AI Logic
  - target_host: firebasevertexai.googleapis.com
    target_type: https
    target_port: 443
    source_type: http
    source_port: 1444
    redact_request_headers:
      - X-Goog-Api-Key
      - Authorization
      - X-Firebase-AppCheck
      - X-Firebase-Appcheck
      - Accept-Language
      - User-Agent
      - X-Goog-Api-Client
      - X-Firebase-AppVersion
      - X-Firebase-Appversion
      - X-Firebase-AppId
      - X-Firebase-Appid
      - X-Ios-Bundle-Identifier
      - x-ios-bundle-identifier
